# Build + test on both operating systems the app runs on, so the macOS and
# Windows versions can never drift apart silently (M8 of the Windows port).
#
# Both GitHub-hosted images ship PostgreSQL; we start it and create the same
# role/db/port the repo's docker-compose uses, so DATABASE_URL is identical.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      DATABASE_URL: postgresql://tenant_ai:tenant_ai@localhost:5433/tenant_ai
      PII_ENCRYPTION_KEY: b18f16b9017984f6a8fa9432ef01309a460666f71e81651f2f1a034e43b49521
      NEXTAUTH_SECRET: ci-nextauth-secret
      TENANT_AUTH_SECRET: ci-tenant-secret
      NEXTAUTH_URL: http://localhost:3000
      TENANT_SITE_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:PGBIN\pg_ctl" -D "$env:PGDATA" -o "-p 5433" -w start
          & "$env:PGBIN\psql" -p 5433 -U postgres -c "CREATE ROLE tenant_ai LOGIN PASSWORD 'tenant_ai' SUPERUSER;"
          & "$env:PGBIN\psql" -p 5433 -U postgres -c "CREATE DATABASE tenant_ai OWNER tenant_ai;"
        env:
          PGPASSWORD: root

      - name: Start PostgreSQL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew services start postgresql@14 || brew services start postgresql
          for i in $(seq 1 30); do pg_isready && break; sleep 1; done
          # default port is 5432 on the runner; run a second cluster on 5433 to match the repo
          initdb -D "$RUNNER_TEMP/pg5433" -U postgres
          pg_ctl -D "$RUNNER_TEMP/pg5433" -o "-p 5433" -w start
          psql -p 5433 -U postgres -c "CREATE ROLE tenant_ai LOGIN PASSWORD 'tenant_ai' SUPERUSER;"
          psql -p 5433 -U postgres -c "CREATE DATABASE tenant_ai OWNER tenant_ai;"

      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - name: Migrate + seed
        run: |
          npx prisma migrate deploy --schema=apps/server/prisma/schema.prisma
          npm run db:seed
      - name: Unit + integration tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=parity/${{ runner.os }}/vitest.json
      - name: Shutdown drill (IPC path)
        run: node scripts/stress/shutdown-drill.mjs --cycles 3 --mode ipc --port 3091 --grace 5000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-${{ runner.os }}
          path: parity/
