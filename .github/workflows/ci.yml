# Build + test on both operating systems the app runs on, so the macOS and
# Windows versions can never drift apart silently (M8 of the Windows port).
#
# Infra comes from scripts/infra.mjs (native Postgres 16 + Redis on the same
# ports/credentials as docker-compose), so DATABASE_URL/REDIS_URL are identical
# to a developer machine and no Docker daemon is needed on the runners.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      DATABASE_URL: postgresql://tenant_ai:tenant_ai@localhost:5433/tenant_ai
      REDIS_URL: redis://localhost:6380
      PII_ENCRYPTION_KEY: b18f16b9017984f6a8fa9432ef01309a460666f71e81651f2f1a034e43b49521
      NEXTAUTH_SECRET: ci-nextauth-secret
      TENANT_AUTH_SECRET: ci-tenant-secret
      NEXTAUTH_URL: http://localhost:3000
      TENANT_SITE_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same native Postgres 16 + Redis the Windows launcher uses (scripts/infra.mjs):
      # Postgres binaries come with `npm ci` (embedded-postgres), Redis is
      # downloaded on Windows and comes from brew on macOS. No Docker on either runner.
      - name: Install Redis (macOS)
        if: runner.os == 'macOS'
        run: brew install redis
      - name: Start native infra (postgres + redis on the compose ports)
        run: |
          node scripts/infra.mjs install redis
          node scripts/infra.mjs up postgres redis
          node scripts/infra.mjs status
      - run: npm run db:generate
      - run: npm run build
      - name: Migrate + seed
        run: |
          npx prisma migrate deploy --schema=apps/server/prisma/schema.prisma
          npm run db:seed
      - name: Unit + integration tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=parity/${{ runner.os }}/vitest.json
      - name: Shutdown drill (IPC path)
        run: node scripts/stress/shutdown-drill.mjs --cycles 3 --mode ipc --port 3091 --grace 5000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-${{ runner.os }}
          path: parity/
